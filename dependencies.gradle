dependencies {
    // 本模组只依赖 GT5U，且刻意不依赖 UniMixins（无 Mixin）。
    // 编译目标对齐 GTNH 2.8.4（实机 GT5U 5.09.51.482）。
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.51.476") { transitive = false }

    // 以下为编译期可见性依赖：GT5U 的 API 类型签名引用它们
    // （例如 MTEHatch implements appeng.api.crafting.ICraftingIconProvider；
    //   机器 GUI 走 ModularUI 1.x 的 ModularWindow/UIBuildContext/NumericWidget）。
    // 它们在任何 GTNH 实例中都由整合包提供，因此不发布为运行时依赖。
    api("com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-872-GTNH:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI:1.3.1:dev") { transitive = false }
    api("com.github.GTNewHorizons:ModularUI2:2.3.45-1.7.10:dev") { transitive = false }
    api("com.github.GTNewHorizons:GTNHLib:0.9.41:dev") { transitive = false }
    api("com.github.GTNewHorizons:StructureLib:1.4.20:dev") { transitive = false }
}
